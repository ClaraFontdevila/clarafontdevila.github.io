- title: "Catholic schools in the marketplace: Changing and enduring religious identities"
  authors: "Fontdevila, C., Zancajo, A., & Verger, A."
  year: 2024
  source: "Peabody Journal of Education"
  post: ", 99(4), 464–481"
  kind: "Article"
  topics: [markets, religious]
  link: "https://doi.org/10.1080/0161956X.2024.2381393"
  abstract: "Despite controversies surrounding faith-based schooling, religious schools continue to play a prominent role in numerous education systems. Nonetheless, empirical research on nonstate religious schools operating in a market context remains limited and fragmented. On the one hand, while religious and cultural studies investigate the evolution of religious education (RE), they tend to focus on state schools while overlooking the impact of market forces. On the other hand, research on education markets often treats religious private schools as a uniform category with a fixed identity. This study aims to bridge this gap by delving into the responses of religious private schools to competitive pressures, focusing on how these schools negotiate their religious identities in a market context. With this objective, the paper presents a case study of Catholic school networks in Catalonia, Spain. We identify three different approaches to RE and religious identity developed by these school networks—confessional, culture-centric and value-centric. The triggering factors and enabling conditions behind these approaches are examined in detail. The study concludes by discussing the relevance of these findings for ongoing debates around the public funding of faith-based schools and the tensions posed by such policies in terms of social cohesion, educational pluralism, and equity."

- title: "Still waiting for the (data) revolution. Examining supply-demand mismatches in the production of SDG4 metrics"
  authors: "Fontdevila, C."
  year: 2024
  source: "International Journal of Educational Development"
  post: ", 103, 102928"
  kind: "Article"
  topics: [evaluation, io]
  link: "https://doi.org/10.1007/978-3-032-27750-3_17"
  abstract: "In the context of the 2030 Agenda, high hopes were placed in the production of global metrics. Such expectations rest upon two main assumptions: first, that global data demands will lead to an increase in domestic data supply; and second, that global data needs are closely aligned with domestic data needs. With several years remaining until 2030, this paper critically examines these assumptions in relation to recent developments in the education field. In so doing, it highlights the need for greater reflection on the opportunity costs associated with the production of globally comparable data, and for an empirically informed analysis of the necessary conditions for strengthening education information systems and domestic statistical capacity."

- title: "Realising the human development promise in dual VET"
  authors: "Vanderhoven, E., Fontdevila, C., Langthaler, M., & Valiente, O."
  year: 2024
  source: "Compare: A Journal of Comparative and International Education"
  post: ", 55(3), 496–511"
  kind: "Article"
  topics: [inequality]
  link: "https://doi.org/10.1080/03057925.2024.2309240"
  abstract: "Despite growing consensus around the need for a more holistic vision of development, realising the human development potential of educational interventions has proven a challenging task. This Forum grapples with how these tensions manifest in the international transfer of dual models of Vocational Education and Training (dVET) to low- and middle-income countries. While dVET has gained global currency, its developmental potential has been primarily framed in economic terms. Conversely, its alignment with human development remains an abstract possibility and is often not reflected in the policy design of dVET transfer attempts.Each contribution to this Forum probes a different facet of these tensions, exploring how dVET can be calibrated in different contexts to realise its human development potential. Taking a practice-led approach and featuring representatives from cooperation agencies, consultancy groups, and research organisations, this piece contributes to ongoing debates about the possibility of effectively integrating human development thinking into education policy."

- title: "Suitable for global consumption: Turning German dual training into a portable policy idea"
  authors: "Fontdevila, C., & Valiente, O."
  year: 2024
  pre: "In D. B. Edwards et al. (Eds.), "
  source: "Researching Global Education Policy"
  post: " (pp. 94–114). Bristol University Press"
  kind: "Chapter"
  topics: [io]
  link: "https://doi.org/10.1332/policypress/9781447368021.003.0004"
  abstract: "Over the past decade, dual training (DT) has consolidated its status as a travelling policy idea. Born in German-speaking countries, DT combines school-based education with highly regulated work-based training and generates interest among a growing number of countries. The challenges encountered by policy transfer dynamics behind the spread of DT have sparked considerable debate, but much less has been said on the origins of DT as a portable, export-ready policy. Likewise, while there is growing understanding on why recipient countries might be interested in DT, there is less clarity on how this policy idea acquired global currency. In light of this, this chapter examines the articulation of the German model of DT as a mobile policy idea. Building on documentary analysis and semi-structured interviews, and informed by von Gliszczynski and Leisering’s work on the articulation of global social policy, the chapter identifies a number of enabling and limiting factors that explain the (relative) spread of the DT policy idea. Particular attention is paid to the discursive and institutional efforts made by the German polity to promote DT. In so doing, the chapter contributes to shedding light on the role of bilateral cooperation in the production of global policies."

- title: "Just another brick in the wall? The changing legitimacy and relevance of the World Bank in global education"
  authors: "Fontdevila, C., Menashy, F., & Verger, A."
  year: 2024
  pre: "In A. Vetterlein & T. Schmidtke (Eds.), "
  source: "The Elgar Companion to the World Bank"
  post: " (pp. 204–215). Edward Elgar"
  kind: "Chapter"
  topics: [io]
  link: "https://doi.org/10.4337/9781802204780.00030"
  abstract: "This chapter provides a synthesis of the evolving role of the World Bank in the education-for-development realm, while also identifying research areas that beg for further investigation. We show how, whilst the World Bank gained a hegemonic position in the education-for-development field during the 1980s, its commitment to the Washington Consensus and to a pro-market agenda ended up eroding its international legitimacy. In response, the Bank embraced a more heterodox reform agenda and a more client-oriented approach - with the downside of its policy message losing power and internal cohesion. In parallel, this international organization has gone through continual internal restructuring, and faces growing levels of competition on the part of other organizations similarly operating as sources of funding and technical expertise. All these factors have contributed to the Bank’s diminished centrality in the education-for-development compact, stimulating a process of soul-searching aimed at reassessing its own position in a multi-polar world."

- title: "NEPC review: Spark & Sustain"
  authors: "Fontdevila, C., Verger, A., & Zancajo, A."
  year: 2024
  plain: "National Education Policy Center, Boulder, CO"
  kind: "Report"
  topics: [markets]
  link: "https://eprints.gla.ac.uk/328332/"
  abstract: "A McKinsey & Company report aims to provide a toolbox for policymakers and other stakeholders on the policy reforms and governance strategies that can promote sustained improvement in students’ learning outcomes. Significant analytical and methodological shortcomings raise doubts about the report’s findings and conclusions, however. For instance, not considering counterfactual cases (i.e., countries that do not experience an improvement) limits the report’s capacity to establish causal links between the strategies identified and the improvement of learning outcomes. The report's usefulness is further weakened by the lack of specificity and universal scope of its recommendations and the superficial analysis of factors shaping implementation processes."

- title: "Not everything that moves must converge: Evidence from global policy and practice on performance-based accountability"
  authors: "Verger, A., Ferrer-Esteban, G., & Fontdevila, C."
  year: 2024
  pre: "In D. B. Edwards, A. Verger, K. Takayama & M. McKenzie (Eds.), "
  source: "Researching Global Education Policy: Diverse Approaches to Policy Movement"
  post: " (pp. 39–69). Bristol University Press"
  kind: "Chapter"
  topics: [evaluation]
  link: "https://doi.org/10.1332/policypress/9781447368021.003.0002"
  abstract: "Policy convergence is an often-assumed outcome of transnational policy movement. However, different scholars have recently drawn attention to the need to unpack and critically interrogate such assumptions – going beyond the policy adoption stage and paying greater attention to sources of policy variation. This chapter engages with these debates by examining implementation patterns of performance-based accountability (PBA), a model that has expanded globally over the last few decades. Drawing on analyses of the Program for International Student Achievement (PISA) dataset of the Organisation for Economic Co-operation and Development (OECD) spanning 55 countries and seven cycles (from 2000 to 2018), our study relies on different convergence tests to assess, first, how and to what extent PBA policies have advanced across different educational systems over time, and, second, the explanatory power of two theoretically plausible sources of variation that might contribute to explaining divergence patterns – namely, administrative regimes and partisan politics. The chapter shows first that there is not a single pattern of convergence in practice around PBA, for while many countries might adopt similar discourses and policy instruments, the uses of such policies and their penetration in schools are very uneven. Second, our study shows that PBA patterns in practice are, to some extent, contingent on administrative regimes, whereas partisan politics appear to have a more limited explanatory power."

- title: "The politics of good enough data. Developments, dilemmas and deadlocks in the production of global learning metrics"
  authors: "Fontdevila, C."
  year: 2023
  source: "International Journal of Educational Development"
  post: ", 96, 102684"
  kind: "Article"
  topics: [evaluation, io]
  link: "https://doi.org/10.1016/j.ijedudev.2022.102684"
  abstract: "The indicator framework established for the monitoring of SDG4 is unambiguous on the need to advance in the production of global learning data. However, the production of SDG4 learning metrics has been riddled with technical and political difficulties. Drawing on a combination of documentary analysis, interviews and non-participant observation, this paper reconstructs the process of negotiation of the data suppliers, statistical routines and reporting standards necessary for the production of SDG4 learning metrics. The paper thus offers insight into the mechanics of global quantification, and on the transformative impact of such processes on the agendas and relationships of partaking organizations."

- title: "Markets in education and school segregation: Paths of problematization and reform"
  authors: "Zancajo, A., Fontdevila, C., & Verger, A."
  year: 2023
  pre: "In V. Dupriez et al. (Eds.), "
  source: "Educational Markets and Segregation"
  post: ". Springer"
  kind: "Chapter"
  topics: [markets, inequality]
  link: "https://doi.org/10.1007/978-3-031-36147-0_5"
  abstract: "Over the last years, a broad consensus has been forged regarding the negative impact of market policies on educational equity, especially in terms of school segregation. The preoccupation with the equity effects of educational markets has penetrated the policy agenda of different countries, although it has not crystallized in a univocal reform approach. Building on the results of a systematic literature review, this chapter examines how educational markets have been problematized in relation to the phenomenon of school segregation, as well as what policy and regulatory options have been adopted in different education systems to address them. The findings show that, while the problematization of educational markets is generally motivated by their impact on educational inequalities, the specific axes of inequality and the factors and actors triggering problematization processes vary greatly across contexts. The chapter also finds that educational reforms aimed at mitigating the role of markets on segregation tend to focus on three main regulatory areas – namely, school funding, school choice and admissions, and the authorization of educational providers. Finally, the chapter reflects on the political and implementation challenges, among other limitations, of these regulatory reforms, concluding that their effectiveness in countering market forces remain still an open question."

- title: "An organized anarchy? Understanding the role of German cooperation in the construction and export of the dual training model"
  authors: "Fontdevila, C., Schneider, S., & Valiente, O."
  year: 2022
  source: "International Journal of Training and Development"
  post: ", 26(4), 585–605"
  kind: "Article"
  topics: [io]
  link: "https://doi.org/10.1111/ijtd.12274"
  abstract: "The role of German cooperation as a key force behind the worldwide dissemination of dual training is well‐established within the specialized literature. The multilayered and fragmented nature of the German cooperation landscape suggests that German efforts in this area follow a complex and evolving interplay of motivations—yet the rationales behind Germany's bilateral work in the area of technical and vocational education and training (TVET) have rarely been examined in a systematic way. Additionally, existing approaches to the question of aid motivations as provided by economics and international relations scholarship appear to be ill‐suited to understanding the rationales behind Germany's TVET cooperation efforts. Drawing on a combination of document analysis and interviews with key stakeholders, this paper investigates the heterogeneity of drivers and motivations behind German cooperation efforts in the promotion and export of the dual training model and examines the coordination challenges posed by this diversity. The paper finds that German efforts in the international promotion of dual training are driven by at least three analytically distinct rationales that correspond roughly to three differentiated poles within the German policy space—namely, the economic, development and education arenas. The paper also finds that this diversity of motivations poses important coordination challenges—and that, while recent coordination efforts have succeeded in securing some degree of rhetorical consistency, only limited progress has been made in terms of operational coherence."

- title: "Post-dual training transitions in Mexico: Apprentices’ strategies during the COVID-19 lockdown"
  authors: "Hernández-Fernández, J., Fontdevila, C., & Marsán, E."
  year: 2022
  source: "Profesorado"
  post: ", 26(3), 53–78"
  kind: "Article"
  topics: [inequality]
  link: "https://doi.org/10.30827/profesorado.v26i3.23542"
  abstract: "The article explores how Covid-19 lockdown in Mexico affected the transitions of apprentices that completed the Mexican Model of Dual Training (MMDT) in 2020. The MMDT is a modality of technical and vocational education that combines work-based and school-based training at upper secondary school. We performed a longitudinal research design consisting of two waves of in-depth interviews with a sample of 52 apprentices in two states of Mexico (Coahuila and State of Mexico). The first wave of interviews took place in 2019 and the second wave in 2020, after apprentices completed the MMDT. Our analysis explores whether apprentices’ aspirations and expectations were fulfilled or how they were readjusted during their transition in times of Covid-19 lockdown. Our results show three main paths of transitions. First, a group of apprentices who settled for a second-best option in order to access HE or the labor market. Second, a group of apprentices with certain economic stability who managed to fulfil their original expectations by adapting and reacting to the circumstances; and third, a group that could afford to wait for (education or labor) opportunities to improve and decided to put their plans on hold. We conclude that the apprentices’ socioeconomic status operated as a key mediating factor that modulated the opportunities and strategies available to these youngsters in their attempt to adapt and adjust their plans according to the circumstance."

- title: "El professorat als centres de màxima complexitat: com reclutar-lo i retenir-lo"
  authors: "Fontdevila, C."
  year: 2022
  pre: "In A. Tarabini (Coord.), "
  source: "Anuari 2022. Els reptes de l’educació a Catalunya"
  post: " (pp. 311–346). Fundació Bofill"
  kind: "Chapter"
  topics: [inequality, teachers]
  link: "https://eprints.gla.ac.uk/343951/"
  abstract: "L’estratificació docent és un fenomen ben documentat. Hi ha evidència creixent que l’alumnat de menor estatus socioeconòmic té major probabilitat d’escolaritzar-se en centres amb professorat menys qualificat o experimentat, amb plantilles menys estables, o infra-dotats en termes de recursos docents. Es tracta de tendències que inevitablement exacerben les desigualtats educatives i socials. A Catalunya, la distribució del professorat dins el sistema educatiu rarament ha estat objecte del debat públic o d’una acció política sostinguda. Tanmateix, una agenda d’equitat passa necessàriament per abordar aquesta qüestió, corregint possibles desequilibris vinculats al perfil social i educatiu de l’alumnat, assegurant que els centres amb major vulnerabilitat social puguin atreure i retenir aquells docents amb un perfil més adequat, i garantint que el professorat treballa en les condicions que els permeten desplegar-se plenament com a professionals. Aquest capítol pretén articular un debat sobre aquestes qüestions, identificant els principals reptes del sistema educatiu català en matèria d’assignació docent a centres d’alta complexitat, així com les principals opcions polítiques que haurien de permetre abordar aquests reptes."

