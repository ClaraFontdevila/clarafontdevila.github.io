- title: "The micro-level design of public subsidies for private schools: A typological approach"
  authors: "Zancajo, A., & Fontdevila, C."
  year: 2026
  source: "European Policy Analysis"
  post: ", 12(4), e70059"
  kind: "Article"
  topics: [markets]
  link: "https://www.researchgate.net/publication/414868907_The_Micro-Level_Design_of_Public_Subsidies_for_Private_Schools_A_Typological_Approach"
  abstract: "Public subsidies for private schools (PSPSs) are a widespread policy instrument across Western European education systems. Despite considerable heterogeneity in their design, systematic classifications of their varying configurations remain lacking. This paper adopts a micro‐level approach to policy design to examine how PSPSs are calibrated. To this end, we develop a descriptive typology built around four context‐invariant constitutive dimensions and apply it to 11 Western European education systems. The exercise yields four distinct types of PSPSs, each capturing a particular relationship between public authorities and private educational providers. We argue that this design‐centric perspective offers analytical leverage to advance two persistent debates in the field: the impact of these policy instruments and the dynamics of policy change underpinning their evolution. More broadly, the typology illustrates the value of descriptive classification for bringing the analytical insights from the study of micro‐level policy design into empirical research."

- title: "Publicly funded religious schools: for what purposes, and with what effects? Connecting normative and empirical debates"
  authors: "Fontdevila, C., & Vanderhoven, E."
  year: 2026
  source: "British Journal of Sociology of Education"
  post: ", 47(3), 444–462"
  kind: "Article"
  topics: [markets, religious]
  link: "https://doi.org/10.1080/01425692.2025.2591865"
  abstract: "Debates about the public funding of religious schools (PFRSs) have tended to retain a theory-centric nature, remaining largely disconnected from available evidence. Responding to calls for greater cross-fertilisation between philosophical and empirical research, and drawing on a review of the literature, this paper aims to develop an understanding of how and under which conditions PFRSs facilitate or jeopardise the realisation of different values and educational goods. To this end, we parse out a series of claims that recur in debates around PFRSs and summarise existing empirical research related to each. Based on this, we identify three sets of contextual variables relevant to understanding PFRSs’ contrasting outcomes: the formal and de facto status of different religious groups, the governance of religious schooling and religious education, and the heterogeneity of the religious-school category. The paper demonstrates the potential of a sociological perspective to facilitate an understanding of PFRSs more amenable to policy analysis and action."

- title: "Examining pro-equity redesigns of educational quasi-markets: a mechanism-based approach to their effects"
  authors: "Fontdevila, C., & Zancajo, A."
  year: 2026
  source: "Journal of Educational Administration and History"
  post: ", 58(2), 201–220"
  kind: "Article"
  topics: [markets, inequality]
  link: "https://doi.org/10.1080/00220620.2025.2538455"
  abstract: "The redesign of educational quasi-market instruments has been gaining traction in response to the negative equity impacts of these policies, with various educational systems introducing adjustments in the design of school-choice schemes and subsidies for private schools. However, the capacity of such policy calibrations to address inequalities remains open to question. This paper develops an analytical framework to understand the effects of redesign initiatives and inform policy action. Drawing on a mechanism-based approach to policy design, we propose and apply a theoretically-driven framework situating the causality between policy problems, instrument design and outcomes at the centre of the analysis. Examining the recent wave of redesign reforms, the paper demonstrates that the equity-enhancing potential of calibrations can be assessed based on their capacity to disrupt the mechanisms connecting quasi-market instruments with educational inequalities. It also finds that some mechanisms prove particularly challenging to affect, inviting reflection on the limits of redesign."

- title: "They are born, age, and survive: The construction of policy models by International Organizations. The case of the OECD’s school autonomy with accountability"
  authors: "Fontdevila, C., & Verger, A."
  year: 2025
  source: "Comparative Education Review"
  post: ", 69(1), 164–183"
  kind: "Article"
  topics: [evaluation, io]
  link: "https://doi.org/10.1086/734822"
  abstract: "Although the role of international organizations in the diffusion of education policy is widely acknowledged, their role in the articulation of policy ideas remains comparatively underresearched. This article addresses this gap through a case study on the role of the OECD in the construction of the School Autonomy with Accountability policy model—a governance approach that grants schools greater decision-making capacity in exchange for more intensive monitoring mechanisms. Informed by a combination of interviews and documentary analysis, our article shows that the construction of the model within the OECD has followed different stages, with the model enjoying varying levels of visibility, contestation, and universalist ambition in each of them. The article shows that model construction is an erratic process affected by the interplay of different forms of expertise and hierarchies, and it cautions against totalizing narratives that portray international organizations as coherent all-powerful entities."

