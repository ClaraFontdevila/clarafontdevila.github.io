- title: "How and why policy design matters: Understanding the diverging effects of public-private partnerships in education"
  authors: "Verger, A., Moschetti, M., & Fontdevila, C."
  year: 2020
  source: "Comparative Education"
  post: ", 56(2), 278–303"
  kind: "Article"
  topics: [markets, inequality]
  link: "https://doi.org/10.4337/9781839106033.00017"
  abstract: "Despite Public-Private Partnerships’ (PPPs) growing popularity within education policy circles, research on their effects yields contradictory results. The understanding of PPP effects is limited by the prevalence of generalist analyses that neglect to acknowledge the exceptional heterogeneity of the policy frameworks in which PPPs crystallize. Building on a scoping literature review, this paper aims at identifying patterns of effects of main PPP modalities on education (namely vouchers, charter schools and public subsidies for private schools) by considering the mediating role of policy-design variables. Our results show that PPP configurations oriented at the generation of market-like dynamics are frequently found to exacerbate school segregation and educational inequalities. Conversely, those PPP arrangements less conducive to market competition and those that follow an affirmative action rationale (such as targeted vouchers) are more likely to yield more positive effects on learning outcomes than other types of PPPs, without necessarily undermining equity."

- title: "Educating on a budget: The subsistence model of low fee private schooling in Peru"
  authors: "Balarin, M., Fontdevila, C., Marius, P., & Rodríguez, M. F."
  year: 2019
  source: "Education Policy Analysis Archives"
  post: ", 27(132)"
  kind: "Article"
  topics: [markets, inequality]
  link: "https://doi.org/10.14507/epaa.27.4328"
  abstract: "Over the last decades, Peru has experienced an extraordinary rise of low-fee private schools (LFPSs). While global debates on the quality of this modality of schooling have been gaining currency, research on the organizational practices of LFPSs remains comparatively underdeveloped. This paper aims at identifying and describing the managerial, business and organizational practices exhibited by Peruvian LFPSs– and at understanding them in relation to the social norms and institutional arrangements specific to the context in which they operate. The study draws on a combination of archival analysis, interviews with decision-makers, and interviews with school owners and principals. The results of our research show that the specificities of the socioeconomic, cultural and regulative environments in which Peruvian LFPSs operate have led to the consolidation of a particular subsistence model of LFPS where profit-making appears to play a limited role. This model is also characterized by the low formalization of management routines, the impossibility to generate economies of scale, and the reliance on interpersonal trust as a means to reduce risk – in a context of low bureaucratization and limited regulatory oversight. We argue that, in view of the distinctly low achievement levels of Peruvian LFPSs, gaining a fine-grained understanding of their organizational practices (and the incentives they respond to) remains a relevant task, and a necessary step to devise effective policy strategies."

- title: "Reforming governance through policy instruments: How and to what extent standards, tests and accountability in education spread worldwide"
  authors: "Verger, A., Fontdevila, C., & Parcerisa, L."
  year: 2019
  source: "Discourse: Studies in the Cultural Politics of Education"
  post: ", 40(2), 248–270"
  kind: "Article"
  topics: [evaluation]
  link: "https://doi.org/10.1080/01596306.2019.1569882"
  abstract: "In the last decades, most countries have adopted data-intensive policy instruments aimed at modernizing the governance of education systems, and strengthening their competitiveness. Instruments such as national large-scale assessments and test-based accountabilities have disseminated widely, to the point that they are being enacted in countries with very different administrative traditions and levels of economic development. Nonetheless, comparative research on the trajectories that governance instruments follow in different institutional and socio-economic contexts is still scarce. On the basis of a systematic literature review (n = 158), this paper enquires into the scope and modalities of educational governance change that national large-scale assessments and test-based accountability instruments have triggered in a broad range of institutional settings. The paper shows that, internationally, educational governance reforms advance through path-dependent and contingent processes of policy instrumentation that are markedly conditioned by prevailing politico-administrative regimes. The paper also reflects on the additive and evolving nature of educational governance reforms."

- title: "Manufacturing an illusory consensus? A bibliometric analysis of the international debate on education privatisation"
  authors: "Verger, A., Fontdevila, C., Rogan, R., & Gurney, T."
  year: 2019
  source: "International Journal of Educational Development"
  post: ", 64, 81–95"
  kind: "Article"
  topics: [markets, io]
  link: "https://doi.org/10.1016/j.ijedudev.2017.12.011"
  abstract: "As one of the most polarised areas in education research, the education privatisation debate generates opportunities for knowledge-brokers to promote their preferred policy alternatives. Based on bibliometric analysis techniques, this paper maps the configuration of the academic debate on privatisation, and explores how it is connected with the references mobilized by a group of international agencies located at the interstices of the research and policy fields. Our findings suggest that, when confronted with certain incentives, some international agencies use evidence in a selective and tactical way as a means to support their pre-established policy preferences."

- title: "The growth and spread of large-scale assessments and test-based accountabilities: A political sociology of global education reforms"
  authors: "Verger, A., Parcerisa, L., & Fontdevila, C."
  year: 2018
  source: "Educational Review"
  post: ", 71(1), 5–30"
  kind: "Article"
  topics: [evaluation]
  link: "https://doi.org/10.1080/00131911.2019.1522045"
  abstract: "The Global Education Reform Movement (GERM) is expanding internationally and reaching countries that seemed to be immune to this education reform approach until quite recently. Accordingly, more and more educational systems in the world are articulated around three main policy principles: accountability, standards and decentralisation. National large-scale assessments (NLSAs) are a core component of the GERM; these assessments are increasingly used for accountability purposes as well as to ensure that schools achieve and promote centrally defined and evaluable learning standards. In this paper, we explore these trends on the basis of a new and original database on NLSAs, as well as on data coming from the Programme for International Student Assessment (PISA) questionnaires. In the paper we also discuss how different theories on policy dissemination/globalisation explain the international spread of NLSAs and test-based accountability worldwide, and reflect on the potential of a political sociology approach to analyse this globalising phenomenon."

- title: "The expansion of private schooling in Latin America"
  authors: "Verger, A., Moschetti, M., & Fontdevila, C."
  year: 2018
  pre: "In K. Saltman & A. Means (Eds.), "
  source: "The Wiley Handbook of Global Educational Reform"
  post: " (pp. 131–155). Wiley Blackwell"
  kind: "Chapter"
  topics: [markets]
  link: "https://doi.org/10.1002/9781119082316.ch7"
  abstract: "Pro-privatization policies are at the center of global debates on educational reform processes of an increasing number of countries and regions. This chapter explores how to disassemble the nature, constraints, and variants of educational privatization in the different countries and territories in the Latin American region. It establishes a typology of trajectories of education privatization that is able to capture not only the formal processes of educational privatization, but also the contextual character in which these processes develop in the region. The chapter presents the conceptual framework and the methodology adopted in the study, both for data collection and for analysis purposes. It also presents the six different trajectories toward educational privatization that were identified in Latin America: as part of the structural reform of the State; as an incremental reform; educational privatization in Nordic welfare states; historical public-private partnerships; privatization by “default”; and privatization by way of disaster."

