- title: "Bringing context to the centre of cross-national attraction"
  authors: "Fontdevila, C., Jacovkis, J., & Valiente, O."
  year: 2025
  pre: "In O. Valiente, S. Maitra, P. Gonon & M. Pilz (Eds.), "
  source: "The Rise of Dual Modes of Vocational Education and Training"
  post: " (pp. 121–139). Routledge"
  kind: "Chapter"
  topics: [io]
  link: "https://doi.org/10.4324/9781003589266-8"
  abstract: "The global spread of Dual Apprenticeships (DAs) policies is conventionally portrayed as a phenomenon indissociable from the attraction exerted by the German dual training system and portrayed as an instance of policy borrowing or transfer. However, whereas there is growing clarity on the reasons behind the emergence of the German dual system as a role model, there is a more limited understanding of the local drivers behind this. In order to grapple with these questions, this chapter examines the processes of cross-national attraction behind the adoption of DAs in two different settings: the creation of the Dual System of Training in India and the establishment of the Mexican Model of Dual Technical and Vocational Education and Training (TVET) in Mexico. The chapter shows that the processes of policy adoption observed in these countries exhibit a number of important differences both in the impulses behind policy borrowing dynamics and the respective foci of attraction. Our results also show that the DA notion is subject to multiple interpretations and that an excessive emphasis on the allure of the German “global role model” is analytically problematic, pointing to the need for further empirical investigation on the role of domestic agency within processes of policy transfer."

- title: "Ongoing directions in global studies in education policy"
  authors: "Verger, A., & Fontdevila, C."
  year: 2025
  pre: "In L. Cohen-Vogel, J. Scott & P. Youngs (Eds.), "
  source: "Handbook of Education Policy Research"
  post: ", 2nd ed. (pp. 79–98). AERA"
  kind: "Chapter"
  topics: [io]
  link: "https://doi.org/10.3102/aera9781960348685_3"
  abstract: "This chapter systematizes different theories about the globalization–education policy nexus and identifies different ways that globalization affects education policy change, including subtle forms of influence and the role of international organizations. The chapter also explores the implications of territorial interdependence and connectedness for education policy—reflecting on but going beyond the policy convergence thesis, and exploring the mechanisms of variation. To this end, the authors map different schools of thought concerned with the nature and outcomes of external influences on education policy. In so doing, they show that global studies in education policy (GSEP) have expanded from a focus on policy diffusion, mainly based on horizontal relations, to the study of a richer, multi-scalar reality. By putting education policy research in dialogue with the broader literature on global governance, policy sociology, and comparative policy analysis, the chapter supports theoretical, methodological, and disciplinary cross-fertilization within GSEP."

- title: "Between teachers’ governance and development: Shifting meanings, methods and policy trends in teacher appraisal (2003–2022)"
  authors: "Ferrer-Esteban, G., Fontdevila, C., & Verger, A."
  year: 2025
  pre: "In X. Dumay, T. Sorensen & L. Paine (Eds.), "
  source: "World Yearbook of Education 2025"
  post: " (pp. 25–55). Routledge"
  kind: "Chapter"
  topics: [teachers, evaluation]
  link: "https://doi.org/10.4324/9781003441731-3"
  abstract: "At the turn of the millennium, a new wave of reforms placed teachers at the forefront of efforts to improve educational outcomes. Teachers' evaluation policies, increasingly linked to learning achievement data, gained unprecedented visibility. Since this critical turn, such policies have evolved significantly. Their contested nature has led countries to experiment with different teacher appraisal approaches, yet evidence of the trajectories of such reforms remains limited. Drawing on up to six cycles of the Organisation for Economic Co-operation and Development's Program for International Student Assessment dataset, we explore the dynamic nature of teacher evaluation reforms, aiming to map and compare appraisal methods both within and across countries. One of the main contributions of our study is examining the explanatory force of national institutions that mediate the enactment of these methods. Our findings indicate that teacher evaluations have expanded to include a more diverse array of methods, thereby reducing the centrality of achievement data. Our results also suggest some patterns relative to the influence of domestic factors. While teacher regulatory regimes demonstrate considerable explanatory power, the impact of partisan politics is more limited and uneven. Finally, our results point to the potentially disruptive impact of COVID-19, though the permanence of these policy changes remains uncertain."

