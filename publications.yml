- title: "The instrumentation of public subsidies for private schools: Different regulatory models with concurrent equity implications"
  authors: "Zancajo, A., Verger, A., & Fontdevila, C."
  year: 2021
  source: "European Educational Research Journal"
  post: ", 21(1), 44–70"
  kind: "Article"
  topics: [markets, inequality]
  link: "https://doi.org/10.1177/14749041211023339"
  abstract: "The availability of public funding for private schools, in both primary and secondary education, has become a common feature in a number of OECD countries. The expansion of public subsidies for privately owned schools has consequences that go far beyond the involvement of private actors in the provision of education. These include deepening forms of regulatory governance in educational systems and the blurring of frontiers between public and private education. Public subsidies for privately owned schools have been adopted following diverse rationalities and in pursuit of different goals. In light of the diversity, this research examines the regulatory configurations of private subsidized education provision across OECD countries, from a policy instruments’ perspective. Based on a systematic review of the literature, the article identifies four models of regulation of private subsidized education, and analyses why and how these models have been problematized and have evolved accordingly. The paper pays particular attention to recent educational reforms adopted, in most cases, to tackle the equity challenges posed by publicly subsidized private provision. Finally, the paper elaborates on the implications that this form of provision has for public education and the achievement of equity goals, and reflects on the potential and limits of regulatory reforms when confronting these issues."

- title: "The business of policy: A review of the corporate sector’s emerging strategies in the promotion of education reform"
  authors: "Fontdevila, C., Verger, A., & Avelar, M."
  year: 2021
  source: "Critical Studies in Education"
  post: ", 62(2), 131–146"
  kind: "Article"
  topics: [markets]
  link: "https://doi.org/10.1080/17508487.2019.1573749"
  abstract: "This paper examines the increasingly diverse range of roles played by the corporate sector in shaping education policy. While a growing body of scholarship has documented the deepening embeddedness of the corporate sector within policy-making processes, empirical research on the strategies mobilized by corporate actors remains unsystematised and fragmentary. Furthermore, existing categorizations of corporate policy-influence strategies are frequently restricted to a limited group of Anglo-Saxon countries and, consequently, are ill suited to capturing emerging policy dynamics globally. Building on the results of a literature review, this paper categorises four emerging strategies articulated by the corporate sector: knowledge mobilization, networking, engaging with grassroots, and leading by example. Each strategy is illustrated with examples from a selection of country case studies. These examples suggest that, in the education policy domain, the corporate sector operates not only as a policy influencer, but increasingly as a policy actor organically embedded within policy-making processes and spaces."

- title: "The construction of SDG4: Reconciling democratic imperatives and technocratic expertise in the making of global education data"
  authors: "Fontdevila, C., & Grek, S."
  year: 2021
  pre: "In S. Grek, C. Maroy & A. Verger (Eds.), "
  source: "World Yearbook of Education 2021"
  post: " (pp. 21–36). Routledge"
  kind: "Chapter"
  topics: [evaluation, io]
  link: "https://doi.org/10.4324/9781003014164-4"
  abstract: "One of the most recent and ambitious exercises in global education monitoring is the construction of the Education 2030 agenda, or Sustainable Development Goal 4 (SDG4). The making of SDG4 represents the single biggest attempt to reach a consensus on a number of universal education indicators, as well as on the appropriate methodologies and data sources. It is a country-led process, steered by UNESCO but with the input of all major international organizations (IOs). Given its collaborative nature, it confronts its participants with technical but also political challenges. Through an in-depth analysis of texts and interviews, this chapter enquires into the tension between technocratic legitimacy and political legitimation, by grappling with the question of how expertise and trust in objectivity can be maintained in political processes that aspire to greater inclusion. Particular attention is paid to UNESCO as the custodian agency of SDG4 with a double accountability obligation to participating countries: first, the robust and objective monitoring of progress towards SDG4; and secondly, the participatory and democratic character of such a process. As the chapter shows, this double responsibility does not happen without friction – it has indeed caused tension between and within the participating IOs, as well as between IOs and other stakeholders."

